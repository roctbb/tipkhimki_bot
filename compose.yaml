services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite3
    volumes:
      - bot-data:/app/data
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bot-data:
